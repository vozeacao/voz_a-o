<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
﻿<title>Voz em Ação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,600&display=swap">
<style>
:root{
  --ground:#b1aeae; --ink:#3e3434; --purple:#5c3e94; --teal:#00a3ad; --teal-d:#2f8f96; --grey-d:#6a6b6e; --magenta:#7b2d84;
  --card:#d3cde5; --card-2:#dcd7ea; --line:#8f8a9d; --white:#fbfaff; --warn:#8c1d2b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Segoe UI",Arial,sans-serif;
}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);overflow:hidden}
*{box-sizing:border-box}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ground)}
#stage{position:absolute;left:0;top:0;width:1760px;height:1320px;transform-origin:0 0;background:var(--ground);font-size:32px;line-height:1.35}
.screen{position:absolute;inset:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:5px solid var(--teal);outline-offset:4px}
svg{display:block}
.abs{position:absolute}

/* CAPA + DIVISOR */
.btn-aqui{position:absolute;background:none;border:0;padding:0}
.btn-aqui svg{transition:transform .2s}
.btn-aqui:hover svg{transform:translateX(10px)}
.btn-go{position:absolute;display:flex;align-items:center;gap:22px;background:none;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:54px;letter-spacing:.02em;color:var(--ink)}
.btn-go i{display:block;width:96px;height:56px;background:var(--purple);clip-path:polygon(0 30%,55% 30%,55% 0,100% 50%,55% 100%,55% 70%,0 70%);transition:transform .2s}
.btn-go:hover i{transform:translateX(10px)}
.div-title{position:absolute;left:100px;top:380px;width:620px;margin:0;font-family:var(--display);font-weight:700;font-size:92px;line-height:1}
.div-quote{position:absolute;left:100px;top:510px;width:560px;font-family:var(--display);font-weight:500;font-size:44px;line-height:1.3;margin:0}
.div-quote small{display:block;margin-top:34px;font-size:40px}

/* TÍTULOS E TEXTO CORRIDO */
.h-kick{position:absolute;left:104px;top:56px;font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.14em;color:var(--purple)}
.h-title{position:absolute;left:100px;top:90px;margin:0;font-family:var(--display);font-weight:700;font-size:96px;line-height:1}
.cols{position:absolute;left:100px;right:100px;top:260px;column-count:3;column-gap:80px;column-fill:balance;font-size:27px;line-height:1.42}
.cols p{margin:0 0 24px;break-inside:avoid-column}
.cols p:last-child{margin:0}
.txt{position:absolute;font-size:29px;line-height:1.4}
.txt p{margin:0 0 22px}
.txt h3{margin:26px 0 8px;font-family:var(--display);font-weight:700;font-size:38px;letter-spacing:.03em}
.txt ul{margin:0 0 20px;padding-left:34px}
.txt li{margin-bottom:6px}
.txt .em{font-style:italic;font-weight:600;color:var(--purple)}
.two-col{column-count:2;column-gap:64px}
.two-col p{break-inside:avoid-column}
.pillar{position:absolute;top:230px;width:500px;height:930px;border-radius:22px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.pillar h3{margin:0;padding:22px 30px 6px;color:var(--white);font-family:var(--display);font-weight:700;font-size:56px;letter-spacing:.04em}
.pillar .lead{padding:0 30px 22px;color:var(--white);font-size:27px;font-weight:600;font-style:italic}
.pillar .in{padding:22px 30px;font-size:26px;line-height:1.36}
.pillar .in p{margin:0 0 12px}
.pillar ul{margin:0;padding-left:30px}
.pillar li{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{padding:6px 22px;border-radius:40px;background:var(--card);font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.04em}
.oc{display:grid;grid-template-columns:70px 1fr;gap:0 24px;align-items:start;background:var(--card);border-radius:16px;padding:16px 28px 16px 20px;font-size:27px;line-height:1.35}
.oc .n{width:56px;height:56px;border-radius:50%;background:var(--purple);color:var(--white);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:36px;margin-top:2px}
.oc b{font-weight:700}

/* PAINEL LATERAL (semanas, teste, ciclo) */
.panel{position:absolute;left:0;top:0;bottom:0;width:560px;padding:70px 60px;background:repeating-linear-gradient(135deg,var(--card-2) 0 34px,#cbc5e0 34px 68px);display:flex;flex-direction:column;align-items:stretch}
.panel .kick{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.12em;line-height:1.15;text-align:center}
.panel .kick b{display:block;font-weight:700;font-size:38px;letter-spacing:.06em}
.pill{align-self:center;margin:26px 0 36px;background:var(--purple);color:var(--white);font-family:var(--display);font-weight:600;font-size:46px;letter-spacing:.06em;padding:4px 56px;border-radius:60px;text-align:center}
.panel h2{margin:0 0 18px;font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;text-align:center;text-wrap:balance}
.panel p{margin:0 0 14px;font-size:28px;line-height:1.35;text-align:center}
.panel p.note{margin-top:8px;font-size:25px;color:var(--purple);font-weight:600}
.panel .art{align-self:center;margin-top:auto}
.habits{margin-top:auto;font-size:21px}
.habits h4{margin:0 0 10px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.08em;text-align:center}
.hgrid{display:grid;grid-template-columns:172px repeat(7,34px);gap:8px 4px;align-items:center;justify-content:center}
.hgrid .d{font-family:var(--display);font-weight:600;font-size:22px;text-align:center}
.hgrid .n{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:500;white-space:nowrap}
.hgrid .n svg{width:26px;height:26px;flex:none;stroke:var(--purple);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chk{appearance:none;-webkit-appearance:none;width:34px;height:34px;margin:0;border:3px solid var(--purple);border-radius:8px;background:var(--white);cursor:pointer;display:grid;place-content:center}
.chk:checked{background:var(--purple)}
.chk:checked::after{content:"";width:16px;height:9px;border-left:5px solid var(--white);border-bottom:5px solid var(--white);transform:rotate(-45deg) translate(2px,-2px)}

.work{position:absolute;left:640px;right:70px;top:110px;bottom:150px;display:flex;flex-direction:column;gap:28px}
.row{flex:1;display:grid;grid-template-columns:70px 1fr;gap:0 22px;min-height:0}
.row.fit{flex:none}
.tab{background:var(--purple);color:var(--white);border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.08em;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.body{display:flex;flex-direction:column;gap:14px;min-height:0}
.ask{background:var(--card);border-radius:16px;padding:18px 30px;font-size:29px;line-height:1.3;font-weight:500}
.ask em{font-style:normal;color:var(--purple);font-weight:600}
.pad{flex:1;min-height:0;width:100%;resize:none;border:0;border-radius:6px;padding:0 6px;background:repeating-linear-gradient(to bottom,transparent 0 51px,var(--line) 51px 53px);font:500 30px/53px var(--body);color:var(--ink);overflow:hidden}
.pad:focus{outline:none;background-color:rgba(255,255,255,.28);box-shadow:0 0 0 4px var(--teal)}
.pad::placeholder{color:#7d7777;font-weight:400}
.missing .pad,.missing .opts{box-shadow:0 0 0 4px var(--warn);background-color:rgba(255,255,255,.3);border-radius:8px}
.two{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.two label{display:flex;flex-direction:column;min-height:0;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.06em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;align-content:start}
.opt{display:flex;gap:16px;align-items:center;font-size:28px;line-height:1.25;cursor:pointer;padding:6px 8px;border-radius:10px}
.opt input{appearance:none;-webkit-appearance:none;width:34px;height:34px;flex:none;margin:0;border:3px solid var(--purple);border-radius:50%;background:var(--white);display:grid;place-content:center;cursor:pointer}
.opt input:checked::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--purple)}
.opt b{font-weight:600}
.opt:has(input:checked){background:rgba(255,255,255,.35)}

.finish{flex:none;display:flex;align-items:center;gap:26px;background:var(--card);border-radius:18px;padding:14px 26px}
.finish .grp{flex:1}
.finish .lbl{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.08em;margin-bottom:6px;text-align:center}
.moods{display:flex;gap:10px;justify-content:center}
.mood{position:relative}
.mood input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.mood span{display:flex;flex-direction:column;align-items:center;gap:2px;width:132px;padding:8px 0 6px;border:3px solid transparent;border-radius:16px;font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.04em}
.mood img{width:66px;height:auto;opacity:.75}
.mood input:checked+span{border-color:var(--purple);background:var(--white)}
.mood input:checked+span img{opacity:1}
.mood input:focus-visible+span{outline:5px solid var(--teal);outline-offset:3px}
.done-btn{flex:none;border:0;border-radius:44px;padding:16px 30px;background:var(--ink);color:var(--white);font-family:var(--display);font-weight:700;font-size:31px;letter-spacing:.05em;white-space:nowrap;text-align:center;line-height:1.1}
.done-btn.ok{background:var(--teal-d);color:#fff}

/* TESTE */
.q{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.q .ask{padding:14px 26px;font-size:29px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sc{position:relative}
.sc input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sc span{display:block;text-align:center;padding:10px 0;border:3px solid var(--purple);border-radius:40px;background:var(--white);font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.02em;white-space:nowrap}
.sc input:checked+span{background:var(--purple);color:var(--white)}
.sc input:focus-visible+span{outline:5px solid var(--teal);outline-offset:3px}
.q.missing .scale{box-shadow:0 0 0 4px var(--warn);border-radius:44px}
.legend{display:flex;flex-direction:column;gap:12px;text-align:left;font-size:24px;line-height:1.25}
.legend b{font-family:var(--display);font-size:28px;letter-spacing:.04em}
.bar{height:14px;border-radius:8px;background:rgba(62,52,52,.2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--purple)}
.res-list{position:absolute;left:1000px;right:100px}
.res-list h3{margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.04em;color:var(--purple)}
.res-item{display:flex;align-items:center;gap:20px;background:var(--card);border-radius:14px;padding:12px 22px;margin-bottom:12px;font-size:30px;font-weight:600}
.res-item b{margin-left:auto;font-family:var(--display);font-size:38px;color:var(--purple)}
.range{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:10px}
.range .sc span{padding:10px 0;font-size:30px;border-radius:14px}

/* NAV */
.nav{position:absolute;left:640px;right:70px;bottom:44px;height:80px;display:flex;align-items:center;gap:22px}
.nav.wide{left:100px;right:100px}
.arrow{width:80px;height:80px;flex:none;border-radius:50%;border:0;background:var(--purple);display:grid;place-items:center}
.arrow:disabled{opacity:.3;cursor:default}
.arrow i{width:30px;height:30px;border-top:7px solid var(--white);border-right:7px solid var(--white)}
.arrow.next i{transform:rotate(45deg);margin-left:-8px}
.arrow.prev i{transform:rotate(-135deg);margin-right:-8px}
.mid{display:flex;gap:10px;margin:0 auto;align-items:center}
.wk{border:3px solid var(--purple);background:transparent;border-radius:40px;padding:6px 20px;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.05em;color:var(--ink);display:flex;gap:8px;align-items:center}
.wk[aria-current="true"]{background:var(--purple);color:var(--white)}
.wk.done::after{content:"✓";color:#046f76;font-weight:700}
.wk.done[aria-current="true"]::after{color:#8ff0f5}
.wk.locked{opacity:.45;border-style:dashed}
.pg{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.08em;min-width:90px;text-align:center}
.who{position:absolute;right:70px;top:34px;font-size:24px;font-weight:500;display:flex;gap:16px;align-items:center}
.who button{background:none;border:0;padding:0;text-decoration:underline;font-size:24px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--teal)}
.dot.off{background:#7d7777}
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:6;width:max-content;max-width:1100px;background:var(--ink);color:var(--white);border-radius:18px;padding:18px 34px;font-size:30px;font-weight:500;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}

/* MODAL */
.modal{position:absolute;inset:0;background:rgba(40,32,32,.55);display:grid;place-items:center;z-index:5}
.modal form{width:900px;background:var(--ground);border-radius:26px;padding:56px 64px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h3{margin:0 0 8px;font-family:var(--display);font-weight:700;font-size:60px}
.modal p{margin:0 0 30px;font-size:29px}
.modal label{display:block;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.08em;margin-bottom:22px}
.modal input{display:block;width:100%;margin-top:6px;padding:14px 20px;font:500 32px var(--body);color:var(--ink);background:var(--white);border:3px solid var(--purple);border-radius:14px}
.modal .acts{display:flex;align-items:center;gap:30px;margin-top:34px}
.modal .acts .go{border:0;border-radius:44px;padding:16px 46px;background:var(--purple);color:var(--white);font-family:var(--display);font-weight:700;font-size:38px;letter-spacing:.05em}
.modal .acts .skip{background:none;border:0;text-decoration:underline;font-size:27px;padding:0}
.err{color:var(--warn);font-size:26px;font-weight:600;min-height:34px;margin-top:8px}

.hint{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--white);border-radius:30px;padding:8px 18px;font:500 14px var(--body);white-space:nowrap;display:none}
@media (orientation:portrait){.hint{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="config.js"></script>

function itemFilled(w,it){
  const k=`s${w.n}_${it.key}`;
  if(it.type==="ctx") return !!(String(A(k+"_sent")||"").trim() && String(A(k+"_reac")||"").trim());
  return !!String(A(k)||"").trim();
}
const weekMissing = n => { const w=WEEKS[n-1]; return w.items.map((it,i)=>itemFilled(w,it)?-1:i).filter(i=>i>=0); };
function canEnter(i){
  const p=PAGES[i];
  if(p.k==="tblock" && p.b>0){ for(let b=0;b<p.b;b++) if(!testAnswered(b)) return "Responda as 4 afirmações do bloco "+(b+1)+" para continuar."; }
  if(p.k==="tres" && !testComplete()) return "Responda todas as 48 afirmações para ver seu resultado.";
  if(p.sec==="cap" && !testComplete()) return "Conclua o Teste de Comunicação para iniciar o capítulo.";
  if(p.k==="w" && p.w>1 && !state.done[p.w-1]) return "Finalize a Semana "+(p.w-1)+" e clique em “Concluir semana "+(p.w-1)+"” para liberar a Semana "+p.w+".";
  if(["refl","ciclo","fim"].includes(p.k) && !state.done[4]) return "Conclua a Semana 4 para liberar as reflexões.";
  return "";
}

/* ====== SINCRONIZAÇÃO (API do apps_script_backend_v2.gs) ====== */
async function api(params, post){
  if(!CONFIG.APPS_SCRIPT_URL || !identity || identity.demo) return null;
  const body = new URLSearchParams(params);
  try{
    const r = post ? await fetch(CONFIG.APPS_SCRIPT_URL,{method:"POST",body}) : await fetch(CONFIG.APPS_SCRIPT_URL+"?"+body);
    return await r.json();
  }catch(e){ return {ok:false}; }
}
const partOf = cap => Object.fromEntries(Object.entries(state.answers).filter(([k])=>k.startsWith("t_")===(cap===CAP_INTRO)));
async function syncIdentify(){
  let any=false, fail=false;
  for(const cap of [CAP_INTRO,CAP]){
    const r = await api({action:"identify",email:identity.email,nome:identity.nome,departamento:identity.departamento||"",empresa:CONFIG.EMPRESA,capitulo:cap});
    if(!r) continue; any=true;
    if(!r.ok){ fail=true; continue; }
    if(cap===CAP) for(let n=1;n<=5;n++){ const v=r.data["Semana"+n]; if(v===true||v==="TRUE"||v==="true") state.done[n]=true; }
    try{ const s=JSON.parse(r.data.Respostas_JSON||"{}"); Object.keys(s).forEach(k=>{ if(A(k)===undefined||A(k)==="") state.answers[k]=s[k]; }); }catch(e){}
  }
  store.set(LS_ST,state);
  if(!any) return setSync(identity&&identity.demo ? "Modo demonstração — não grava na planilha" : "Salvo neste aparelho");
  setSync(fail?"Sem conexão com a planilha":"Sincronizado com a planilha",fail);
}
let sv;
function queueSave(){
  store.set(LS_ST,state);
  if(!CONFIG.APPS_SCRIPT_URL || !identity || identity.demo){ setSync(identity&&identity.demo ? "Modo demonstração — não grava na planilha":"Salvo neste aparelho"); return; }
  clearTimeout(sv);
  sv=setTimeout(async()=>{
    let ok=true;
    for(const cap of [CAP_INTRO,CAP]){ const r=await api({action:"saveAnswers",email:identity.email,capitulo:cap,data:JSON.stringify(partOf(cap))},true); ok=ok&&!!(r&&r.ok); }
    setSync(ok?"Sincronizado com a planilha":"Sem conexão — salvo neste aparelho",!ok);
  },800);
}
async function syncDone(n){
  store.set(LS_ST,state);
  const r = await api({action:"set",email:identity&&identity.email,capitulo:CAP,semana:n,valor:!!state.done[n]});
  if(r) setSync(r.ok?"Sincronizado com a planilha":"Sem conexão — salvo neste aparelho",!r.ok);
}
function setSync(msg,off){ syncMsg=msg; const el=document.querySelector(".who .m"); if(el) el.textContent=msg; const d=document.querySelector(".who .dot"); if(d) d.classList.toggle("off",!!off); }

/* ====== RODA (autoavaliação) ====== */
function levels(){
  return CATS.map((_,ci)=>{ const b=BLOCK_CAT.indexOf(ci); const v=[0,1,2,3].map(j=>+A("t_"+(b*4+j+1))||0); return v.every(x=>x)? Math.round(v.reduce((a,x)=>a+x,0)/4*2) : 0; });
}
function wheel(strong, ghost, size){
  const R=300, band=46, pt=(r,a)=>[(r*Math.cos(a*Math.PI/180)).toFixed(1),(r*Math.sin(a*Math.PI/180)).toFixed(1)];
  const wedge=(r,a0,a1)=>{ const [x0,y0]=pt(r,a0),[x1,y1]=pt(r,a1); return `M0 0L${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}Z`; };
  const uid="w"+Math.random().toString(36).slice(2,6);
  let s=`<svg viewBox="${-R-band-8} ${-R-band-8} ${2*(R+band+8)} ${2*(R+band+8)}" width="${size}" height="${size}" role="img" aria-label="Roda da autoavaliação da comunicação">
   <circle r="${R+band}" fill="#8b7fb8"/><circle r="${R}" fill="#e6e2f1"/>`;
  CATS.forEach((c,k)=>{
    const a0=-120+30*k, a1=a0+30;
    if(ghost[k]) s+=`<path d="${wedge(R*ghost[k]/10,a0,a1)}" fill="#b6acd6"/>`;
    if(strong[k]) s+=`<path d="${wedge(R*strong[k]/10,a0,a1)}" fill="#5c3e94"/>`;
    const mid=a0+15, rr=R+band/2+7, bottom=mid>0&&mid<180;
    const [xa,ya]=pt(rr,bottom?a1:a0),[xb,yb]=pt(rr,bottom?a0:a1);
    s+=`<path id="${uid}${k}" d="M${xa} ${ya}A${rr} ${rr} 0 0 ${bottom?0:1} ${xb} ${yb}" fill="none"/>
        <text font-family="Barlow Condensed,sans-serif" font-weight="600" font-size="${c.length>12?15:17}" letter-spacing=".8" fill="#fff"><textPath href="#${uid}${k}" startOffset="50%" text-anchor="middle">${c.toUpperCase()}</textPath></text>`;
  });
  for(let i=1;i<=10;i++) s+=`<circle r="${R*i/10}" fill="none" stroke="#8b7fb8" stroke-width="${i===10?2.5:1}"/>`;
  for(let k=0;k<12;k++){ const [x,y]=pt(R+band,-120+30*k); s+=`<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="#8b7fb8" stroke-width="1.5"/>`; }
  return s+"</svg>";
}

  else if(it.type==="ctx") inner = `<div class="ask">${it.q}</div><div class="two">
      <label>${it.l1}<textarea class="pad" data-key="${key}_sent" aria-label="${esc(it.l1)}">${val(key+"_sent")}</textarea></label>
      <label>${it.l2}<textarea class="pad" data-key="${key}_reac" aria-label="${esc(it.l2)}">${val(key+"_reac")}</textarea></label></div>`;
  else inner = `<div class="ask">${it.q}</div><div class="opts" role="radiogroup">${it.opts.map(o=>
      `<label class="opt"><input type="radio" name="${key}" data-key="${key}" value="${o[0]}" ${A(key)===o[0]?"checked":""}><span><b>${o[0]}</b> — ${o[1]}</span></label>`).join("")}</div>`;
  return `<div class="row ${it.type==="radio"?"fit":""} ${miss?"missing":""}"><div class="tab">${it.tab}</div><div class="body">${inner}</div></div>`;
}

function toast(msg){ clearTimeout(toastT); $stage.querySelector(".toast")?.remove();
  $stage.insertAdjacentHTML("beforeend",`<div class="toast" role="alert">${msg}</div>`); toastT=setTimeout(()=>$stage.querySelector(".toast")?.remove(),4200); }
function go(i){
  i=Math.max(0,Math.min(PAGES.length-1,i));
  if(i>page){ const why=canEnter(i);
    if(why){ const p=PAGES[page];
      if(p.k==="tblock"&&!testAnswered(p.b)){ flagMissing="t"+p.b; render(); }
      toast(why); return; } }
  page=i; flagMissing=null; render();
}
function askIdentity(then){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<form novalidate><h3>Antes de começar</h3><p>Seu progresso fica salvo e você continua de qualquer aparelho. Preencha uma vez.</p>
   <label>NOME<input id="f-nome" autocomplete="name" value="${identity&&identity.nome?esc(identity.nome):""}"></label>
   <label>E-MAIL<input id="f-email" type="email" autocomplete="email" value="${identity&&identity.email?esc(identity.email):""}"></label>
   <label>DEPARTAMENTO<input id="f-dep" value="${identity&&identity.departamento?esc(identity.departamento):""}"></label>
   <div class="err" id="f-err" role="alert"></div>
   <div class="acts"><button class="go" type="submit">ENTRAR</button><button class="skip" type="button">Só quero ver (modo demonstração)</button></div></form>`;
  $stage.appendChild(m);
  const $=id=>m.querySelector(id); $("#f-nome").focus();
  m.querySelector("form").onsubmit=e=>{ e.preventDefault();
    const nome=$("#f-nome").value.trim(), email=$("#f-email").value.trim(), dep=$("#f-dep").value.trim();
    if(!nome||!/^\S+@\S+\.\S+$/.test(email)){ $("#f-err").textContent="Informe seu nome e um e-mail válido."; return; }
    identity={nome,email,departamento:dep}; store.set(LS_ID,identity); m.remove(); syncIdentify().then(render); then(); };
  m.querySelector(".skip").onclick=()=>{ identity={demo:true}; store.set(LS_ID,identity); m.remove(); syncMsg="Modo demonstração — não grava na planilha"; then(); };
}
function concluir(n){
  if(state.done[n]){ go(n===4?IDX(x=>x.k==="refl"):IDX(x=>x.k==="w"&&x.w===n+1&&x.part===0)); return; }
  const miss=weekMissing(n);
  if(miss.length){
    flagMissing=n; const firstPart=miss[0]<3?0:1;
    page=IDX(x=>x.k==="w"&&x.w===n&&x.part===firstPart); render();
    toast(`Faltam ${miss.length} resposta${miss.length>1?"s":""} para concluir a Semana ${n}. Preencha os campos destacados.`); return;
  }
  state.done[n]=true; flagMissing=null; syncDone(n); render();
  toast(n===4?"Semana 4 concluída! As reflexões do capítulo foram liberadas.":`Semana ${n} concluída! A Semana ${n+1} foi liberada.`);
}
$stage.addEventListener("click",e=>{
  const g=e.target.closest("[data-goto]"); if(g){ go(+g.dataset.goto); return; }
  const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act;
  if(act==="next") go(page+1);
  else if(act==="prev") go(page-1);
  else if(act==="start"){ if(identity) go(1); else askIdentity(()=>go(1)); }
  else if(act==="id") askIdentity(()=>render());
  else if(act==="done") concluir(+a.dataset.w);
  else if(act==="restart"){ page=0; render(); }
});
function save_(e){ const k=e.target.dataset&&e.target.dataset.key; if(!k) return null;
  state.answers[k]=e.target.type==="checkbox"?e.target.checked:(e.target.dataset.num?+e.target.value:e.target.value); queueSave(); return k; }
$stage.addEventListener("input",e=>{ if(save_(e) && e.target.type==="textarea"){ e.target.closest(".row")?.classList.remove("missing"); } });
$stage.addEventListener("change",e=>{ if(e.target.type==="textarea") return; const k=save_(e); if(!k) return;
  if(e.target.name==="refl_nota"||/^t_/.test(k)){ const nm=e.target.name; render(); $stage.querySelector(`[name="${nm}"]:checked`)?.focus(); } });
document.addEventListener("keydown",e=>{ if(e.target.matches("textarea,input")) return;
  if(e.key==="ArrowRight") go(page+1); if(e.key==="ArrowLeft") go(page-1); });

/* ====== ESCALA: a tela 4:3 sempre cabe inteira, sem rolagem ====== */
const app=document.getElementById("app");
function fit(){ const W=app.clientWidth,H=app.clientHeight, s=Math.min(W/1760,H/1320);
  $stage.style.transform=`translate(${(W-1760*s)/2}px,${(H-1320*s)/2}px) scale(${s})`; }
addEventListener("resize",fit); fit();

page = Math.min(state.page||0, PAGES.length-1);
if(page>0 && canEnter(page)) page=0;
if(identity && !identity.demo) syncIdentify().then(render); else if(identity) syncMsg="Modo demonstração — não grava na planilha";
render();
</script>
